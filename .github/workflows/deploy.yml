name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read  # Permite ao workflow ler o código do repositório

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Obter o código do repositório
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Configurar o Python e executar os testes automatizados do Flask
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies & Test
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt pytest
        python -m pytest

    # 3. Autenticação na AWS através de Repository Secrets (Contornando o bloqueio de OIDC)
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-north-1
        role-to-assume: arn:aws:iam::642328613004:role/devops-cloud-api-github-actions-role
        role-duration-seconds: 1200

    # 4. Efetuar o Login seguro no Amazon ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 5. Compilar a imagem Docker, aplicar a tag única do Git Commit e enviar para o ECR
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: devops-cloud-api
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # 6. Descarregar o modelo atual da Task Definition da AWS
    - name: Download active task definition
      run: |
        aws ecs describe-task-definition --task-definition devops-cloud-api --query taskDefinition > task-definition.json

    # 7. Injetar o novo ID da imagem Docker gerada no passo anterior
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: devops-cloud-api
        image: ${{ steps.build-image.outputs.image }}

    # 8. Realizar o Deploy da nova Task Definition atualizada no ECS Fargate
    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: devops-cloud-api-service
        cluster: devops-cloud-api-cluster
        wait-for-service-stability: true
